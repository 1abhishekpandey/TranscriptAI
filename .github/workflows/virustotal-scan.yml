name: VirusTotal scan

# Scans the APK of a published release on VirusTotal and shows the result
# for the latest release as a badge in the README. Uses only GitHub's own
# runner tools (git, gh, curl, jq) and the VirusTotal API: no third-party
# actions, no other services.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to scan, e.g. v2.1.0"
        required: true

permissions:
  contents: write

concurrency:
  group: virustotal-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VT_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
      REPO: ${{ github.repository }}
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Download the release APK
        run: |
          set -euo pipefail
          APK="TranscriptAI-$TAG.apk"
          gh release download "$TAG" -R "$REPO" -p "$APK" -D apk
          SHA="$(sha256sum "apk/$APK" | awk '{print $1}')"
          echo "APK=apk/$APK" >> "$GITHUB_ENV"
          echo "SHA=$SHA" >> "$GITHUB_ENV"
          echo "Scanning $APK ($SHA)"

      - name: Scan on VirusTotal
        run: |
          set -euo pipefail
          VT=https://www.virustotal.com/api/v3

          # Writes the file's report to report.json. Succeeds only once
          # VirusTotal has finished scanning the file.
          fetch_report() {
            curl -sS -H "x-apikey: $VT_API_KEY" "$VT/files/$SHA" > report.json
            jq -e '(.data.attributes.last_analysis_results // {}) | length > 0' \
              report.json > /dev/null
          }

          # A file VirusTotal already scanned keeps its report. Uploading the
          # same file again returns an analysis id that cannot be looked up.
          if fetch_report; then
            echo "VirusTotal already has a report for this file"
          else
            ANALYSIS_ID="$(curl -sS --fail-with-body \
              -H "x-apikey: $VT_API_KEY" \
              -F "file=@$APK" \
              "$VT/files" | jq -r '.data.id')"

            # The free key allows 4 requests a minute, so check every 30 seconds.
            DONE=false
            for _ in $(seq 1 80); do
              sleep 30
              STATUS="$(curl -sS -H "x-apikey: $VT_API_KEY" \
                "$VT/analyses/$ANALYSIS_ID" | jq -r '.data.attributes.status // "unknown"')"
              echo "status: $STATUS"
              if [ "$STATUS" = "completed" ] && fetch_report; then
                DONE=true
                break
              fi
            done
            [ "$DONE" = true ] || { echo "Scan did not finish in time"; exit 1; }
          fi

          FLAGGED="$(jq '.data.attributes.last_analysis_stats | .malicious + .suspicious' report.json)"
          TOTAL="$(jq '.data.attributes.last_analysis_stats | .malicious + .suspicious + .undetected + .harmless' report.json)"
          echo "FLAGGED=$FLAGGED" >> "$GITHUB_ENV"
          echo "TOTAL=$TOTAL" >> "$GITHUB_ENV"

          echo "Result: $FLAGGED of $TOTAL scanners flagged it"
          jq -r '.data.attributes.last_analysis_results[]
            | select(.category == "malicious" or .category == "suspicious")
            | "  - \(.engine_name): \(.result)"' report.json

      - name: Write the result into the README
        run: |
          set -euo pipefail
          git clone --depth 1 \
            "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" repo
          cd repo

          # The badge always shows the latest release. Scanning an older tag
          # or a pre-release leaves it alone.
          LATEST="$(gh release view -R "$REPO" --json tagName -q .tagName)"
          if [ "$TAG" != "$LATEST" ]; then
            echo "$TAG is not the latest release ($LATEST), so the badge stays as it is"
            exit 0
          fi

          bash .github/scripts/virustotal-badge.sh "$TAG" "$FLAGGED" "$TOTAL" .github/badges/virustotal.svg
          LINE="[![VirusTotal scan of $TAG](.github/badges/virustotal.svg)](https://www.virustotal.com/gui/file/$SHA)"

          awk -v line="$LINE" '
            /<!-- virustotal:start -->/ { print; print line; skip = 1; next }
            /<!-- virustotal:end -->/   { skip = 0 }
            !skip
          ' README.md > README.new
          mv README.new README.md

          git add README.md .github/badges/virustotal.svg
          if git diff --cached --quiet; then
            echo "README already up to date"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(readme): add virustotal scan for $TAG"
          git push origin HEAD:main
